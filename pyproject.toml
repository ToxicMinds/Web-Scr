[project]
name = "supplement-optimizer"
version = "0.1.0"
description = "Plugin-based procurement optimization platform that continuously finds the cheapest cross-retailer shopping basket delivered to a target country."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "ToxicMinds" }]
keywords = ["optimization", "scraping", "procurement", "supplements", "plugin"]

# Core runtime dependencies. Kept lean; browser automation and the Supabase
# client are optional extras so the core (domain + optimizer + reports) stays
# installable and testable without heavy/optional components.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "polars>=1.9",
    "duckdb>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Live browser-based scraping.
browser = ["playwright>=1.47"]
# Supabase persistence (Postgres source of truth).
supabase = ["supabase>=2.9"]
# Everything needed to run the full platform in production.
all = ["playwright>=1.47", "supabase>=2.9"]

[project.scripts]
optimizer = "supplement_optimizer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "types-beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supplement_optimizer"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # flake8-bugbear
    "C4",                # comprehensions
    "SIM",               # simplify
    "TID",               # tidy imports
    "PL",                # pylint
    "RUF",
]
ignore = [
    "PLR0913",  # too many arguments (domain constructors legitimately need many)
    "PLR2004",  # magic value in comparisons inside tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["supplement_optimizer"]

# ---------------------------------------------------------------------------
# mypy (static typing)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "openpyxl.*", "supabase.*", "bs4.*", "playwright.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that touch external systems (network/db/browser)",
    "playwright: tests that require a Playwright browser",
]

[tool.coverage.run]
branch = true
source = ["supplement_optimizer"]
omit = ["*/scrapers/live/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
