name: "Setup Python environment"
description: "Install uv, Python 3.14 and project dependencies with caching."

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python 3.14
      shell: bash
      run: uv python install 3.14

    - name: Install dependencies
      shell: bash
      run: uv sync --extra all
